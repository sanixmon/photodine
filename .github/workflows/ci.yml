name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""
      - name: Install Android platform and build-tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build and Package APKs
        run: |
          chmod +x gradlew
          ./gradlew lint assembleDebug assembleRelease detekt --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: photodine-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: photodine-release-arm64-v8a
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
